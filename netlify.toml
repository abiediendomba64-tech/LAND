[build]
  command = "npm run build:client"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/grab-url-assets"
  to = "/.netlify/functions/grab-url-assets"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/ai/page1-seo"
  to = "/.netlify/functions/page1-seo"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
